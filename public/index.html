<!DOCTYPE html>
<html>
<head>
    <title>🔧 Compilador Golampi → ARM64</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-primary: #1e1e2e;
            --bg-secondary: #313244;
            --bg-tertiary: #45475a;
            --text-primary: #cdd6f4;
            --text-muted: #bac2de;
            --accent-blue: #89b4fa;
            --accent-green: #a6e3a1;
            --accent-red: #f38ba8;
            --accent-yellow: #f9e2af;
            --accent-purple: #cba6f7;
            --success: #40a02b;
            --error: #d20f39;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            line-height: 1.6;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .header {
            background: var(--bg-secondary);
            padding: 15px 20px;
            border-bottom: 2px solid var(--bg-tertiary);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header h1 {
            font-size: 22px;
            color: var(--accent-blue);
            flex: 1;
        }
        
        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 20px;
            background: var(--bg-secondary);
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
        }
        
        .toolbar button {
            padding: 10px 16px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        .toolbar button:hover {
            background: var(--accent-blue);
            color: var(--bg-primary);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }
        
        .main-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px 20px 20px;
            flex: 1;
            overflow: hidden;
        }
        
        .editor-section, .output-section {
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--bg-tertiary);
            overflow: hidden;
        }
        
        .section-title {
            padding: 12px 15px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--bg-tertiary);
            font-weight: bold;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        #codigo {
            flex: 1;
            padding: 12px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
        }
        
        #consola {
            flex: 1;
            padding: 12px;
            background: var(--bg-primary);
            overflow-y: auto;
            font-size: 12px;
        }
        
        #asmOutput {
            font-family: 'Courier New', monospace !important;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 15px 20px;
        }
        
        .button-group button {
            padding: 8px 14px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            font-size: 12px;
        }
        
        .button-group button:hover {
            background: var(--accent-purple);
            color: var(--bg-primary);
            border-color: var(--accent-purple);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Golampi → ARM64 Compiler</h1>
        </div>
        
        <div class="toolbar">
            <button onclick="nuevoArchivo()">📄 Nuevo</button>
            <button onclick="cargarArchivo()">📂 Cargar</button>
            <input type="file" id="fileInput" style="display:none">
            <button onclick="guardarArchivo()">💾 Guardar</button>
            <button onclick="ejecutar()" style="background: var(--success); border-color: var(--success); font-size: 14px;">▶️ Compilar</button>
            <button onclick="limpiarConsola()">🗑️ Limpiar</button>
        </div>
        
        <div class="main-panel">
            <div class="editor-section">
                <div class="section-title">💻 Código Fuente (Golampi)</div>
                <textarea id="codigo" placeholder="func main() {&#10;    fmt.Println(&quot;Hola, Mundo&quot;)&#10;}"></textarea>
            </div>
            
            <div class="output-section">
                <div class="section-title">📋 Salida de Compilación</div>
                <div id="consola"></div>
            </div>
        </div>
        
        <div class="button-group">
            <button onclick="descargarResultado()">📥 Descargar ARM64</button>
            <button onclick="descargarErrores()">📥 Descargar Errores</button>
            <button onclick="descargarTabla()">📥 Tabla de Símbolos</button>
            <button onclick="descargarTokens()">📥 Descargar Tokens</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
